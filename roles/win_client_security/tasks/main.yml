---
- name: "WIN SEC | Asegurar que el Firewall esté habilitado en todos los perfiles"
  community.windows.win_firewall:
    state: enabled
    profiles:
      - Domain
      - Private
      - Public

- name: "WIN SEC | Permitir RDP (Escritorio Remoto)"
  community.windows.win_firewall_rule:
    name: "Remote Desktop"
    localport: 3389
    action: allow
    direction: in
    protocol: tcp
    profiles: private
    state: present