---
# handlers file for roles/linux_security
# Handlers para el rol linux_security

- name: "Recargar UFW"
  community.general.ufw:
    state: reloaded

- name: "Reiniciar fail2ban"
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: "Reiniciar sshd"
  ansible.builtin.systemd:
    name: sshd
    state: restarted